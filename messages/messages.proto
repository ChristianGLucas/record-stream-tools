// This file defines the data contracts (messages) for your Axiom package.
// Every node's --input and --output refers to a message defined here.
//
// Run `axiom create message <Name>` to scaffold a new message below.
// Run `axiom generate` to compile these definitions into language bindings in gen/.
//
// DOCUMENTATION
//   Comments written directly above a message or field declaration are extracted
//   automatically at publish time and shown in the Axiom registry as documentation.
//   Write your descriptions there — no separate doc files needed.
//
//   Leading comment  (no blank line before the declaration) → registry description ✓
//   Detached comment (blank line before the declaration)    → ignored by registry  ✗
//
// This file is yours to edit. Axiom only appends new message blocks — it never
// overwrites or removes content you have written.

syntax = "proto3";

package christiangeorgelucas.record_stream_tools;

option go_package = ".;gen";

// ---------------------------------------------------------------------------
// StreamNdjsonRecords
// ---------------------------------------------------------------------------

// Newline-delimited JSON (NDJSON/JSONL) text to parse record-by-record. Each
// non-blank line is expected to be one complete JSON value (object, array,
// string, number, bool, or null); blank lines are skipped and never produce
// a frame. StreamNdjsonRecords consumes a STREAM of these as one continuous
// document (v0.2.0): parser state (byte accumulator, running line number)
// carries across every frame received in one node invocation, so a
// record's line may span a chunk boundary, and any trailing partial line
// is flushed once the input channel closes. A single frame carrying the
// whole document (N=1) behaves exactly as v0.1.x.
message NdjsonInput {
  // A CHUNK of the NDJSON/JSONL document's raw bytes, UTF-8. Successive
  // frames' text is CONCATENATED byte-for-byte to reconstruct the full
  // document — chunk boundaries need not fall on line boundaries, and a
  // multi-byte UTF-8 rune may be split across two frames (byte-aligned
  // chunking, e.g. from http-tools' StreamBody, is not rune-aligned); do
  // NOT decode/validate a single frame's text in isolation. Lines may be
  // separated by "\n" or "\r\n"; a leading UTF-8 BOM (checked only on the
  // very first frame) and a trailing newline are both tolerated.
  string text = 1;
}

// One parsed NDJSON record, emitted in document order. A malformed line is
// skipped (reported as an error frame, not a crash) and parsing continues
// with the next line, since NDJSON lines are independent of one another.
// The platform's transport-level terminal frame carries no payload — is_final
// is the authoritative end-of-stream signal for this node.
message NdjsonRecordFrame {
  // 0-based position of this frame among frames actually emitted (skipped
  // blank lines do not consume an index).
  int32 index = 1;
  // 1-based source line number this record came from, for error reporting
  // and correlating a frame back to the original document.
  int32 line_number = 2;
  // The record's JSON text, exactly as parsed. Empty when is_error is true.
  string json = 3;
  // True when this line failed to parse as valid JSON; when true, json is
  // empty and error_message explains why. The line is skipped and parsing
  // continues with the next one.
  bool is_error = 4;
  // Human-readable parse error, set only when is_error is true.
  string error_message = 5;
  // True on the last frame emitted for this input document (business-level
  // signal). An input with zero non-blank lines emits exactly one frame
  // with is_final=true and every other field at its zero value.
  bool is_final = 6;
}

// ---------------------------------------------------------------------------
// StreamCsvRecords
// ---------------------------------------------------------------------------

// CSV (or other delimited-text) document to parse row-by-row. Handles
// RFC 4180 quoting, embedded newlines inside quoted fields, CRLF and LF line
// endings, and a leading UTF-8 BOM. StreamCsvRecords consumes a STREAM of
// these as one continuous document (v0.2.0): the underlying csv.Reader is
// driven directly off the input channel, so a row — including a quoted
// field's embedded newline — may span a chunk boundary. A single frame
// carrying the whole document (N=1) behaves exactly as v0.1.x.
message CsvInput {
  // A CHUNK of the CSV document's raw bytes, UTF-8. Successive frames' text
  // is CONCATENATED byte-for-byte to reconstruct the full document — chunk
  // boundaries need not fall on row/field boundaries, and a multi-byte
  // UTF-8 rune may be split across two frames; do NOT decode/validate a
  // single frame's text in isolation. A leading UTF-8 BOM is checked only
  // on the very first frame.
  string text = 1;
  // Field delimiter as a single character. Empty means the default ",".
  // Read from the FIRST frame only; ignored on any later frame — a
  // document's dialect cannot change mid-stream.
  string delimiter = 2;
  // When true, the first row is treated as a header and used to populate
  // each subsequent frame's `fields` map by column name. Defaults to false
  // (proto3 zero value): every row, including the first, is then a data row
  // and `fields` is left empty on every frame — use `values` instead. Read
  // from the FIRST frame only; ignored on any later frame.
  bool has_header = 3;
  // When true, leading whitespace in each field is trimmed (encoding/csv's
  // TrimLeadingSpace option). Defaults to false (whitespace preserved).
  // Read from the FIRST frame only; ignored on any later frame.
  bool trim_leading_space = 4;
}

// One parsed CSV data row (the header row, if any, is consumed to populate
// `fields` on subsequent frames and never itself emitted as a frame).
// A row-level syntax error (e.g. an unterminated quoted field) is unrecoverable
// mid-document — byte alignment after such an error is not well-defined — so
// StreamCsvRecords reports it as a single error frame with is_final=true and
// stops, rather than risking silently-corrupted rows. A row with a different
// column count than the header is NOT an error (values/fields simply reflect
// however many columns that row actually had).
message CsvRecordFrame {
  // 0-based position of this frame among data-row frames actually emitted.
  int32 index = 1;
  // 1-based data row number, counting only data rows (the header row, if
  // consumed, is not counted).
  int32 row_number = 2;
  // Column-name → value for this row, populated only when the input declared
  // has_header=true. Empty when has_header=false. If this row has fewer
  // columns than the header, the missing trailing columns map to ""; if it
  // has more, the extra columns are present in `values` but have no key
  // here (there is no header name for them).
  map<string, string> fields = 3;
  // The row's raw values in column order, always populated (regardless of
  // has_header) so a headerless document is still fully usable.
  repeated string values = 4;
  // True when this row failed to parse as CSV; when true, fields/values are
  // empty and error_message explains why. Parsing stops after this frame.
  bool is_error = 5;
  // Human-readable parse error, set only when is_error is true.
  string error_message = 6;
  // True on the last frame emitted for this input document. An input with
  // zero data rows (empty text, or only a header row) emits exactly one
  // frame with is_final=true and every other field at its zero value.
  bool is_final = 7;
}

// ---------------------------------------------------------------------------
// StreamJsonArrayItems
// ---------------------------------------------------------------------------

// A JSON document whose top-level value is expected to be an array. Elements
// are tokenized and emitted one at a time as they are decoded — the document
// is never fully unmarshaled into memory before the first frame is emitted,
// so a large array streams progressively. StreamJsonArrayItems consumes a
// STREAM of these as one continuous document (v0.2.0): the underlying
// json.Decoder is driven directly off the input channel, so an element may
// span a chunk boundary. A single frame carrying the whole document (N=1)
// behaves exactly as v0.1.x.
message JsonArrayInput {
  // A CHUNK of the JSON document's raw bytes, UTF-8. Successive frames'
  // text is CONCATENATED byte-for-byte to reconstruct the full document —
  // chunk boundaries need not fall on token boundaries, and a multi-byte
  // UTF-8 rune may be split across two frames; do NOT decode/validate a
  // single frame's text in isolation. Whitespace-only or empty text overall
  // is treated as "nothing to stream" (see JsonArrayItemFrame.is_final),
  // not an error.
  string text = 1;
}

// One element of the top-level JSON array, in array order. A structural
// problem — the top-level value is not an array, or an element fails to
// parse — is unrecoverable mid-document (the decoder's position is no longer
// trustworthy past a malformed token), so StreamJsonArrayItems reports it as
// a single error frame with is_final=true and stops.
message JsonArrayItemFrame {
  // 0-based position of this element within the array.
  int32 index = 1;
  // The element's JSON text, exactly as it appeared in the source document
  // (object, array, string, number, bool, or null — whatever the element
  // was). Empty when is_error is true.
  string json = 2;
  // True when the top-level value was not an array, or this element failed
  // to parse; when true, json is empty and error_message explains why.
  bool is_error = 3;
  // Human-readable parse error, set only when is_error is true.
  string error_message = 4;
  // True on the last frame emitted for this input document. A valid empty
  // array ("[]") or whitespace-only/empty text emits exactly one frame with
  // is_final=true and every other field at its zero value.
  bool is_final = 5;
}

// ---------------------------------------------------------------------------
// StreamLogLines
// ---------------------------------------------------------------------------

// Raw multi-line text (e.g. a log file) to split into individual lines.
// StreamLogLines consumes a STREAM of these as one continuous document
// (v0.2.0): the byte accumulator and running line number carry across every
// frame received in one node invocation, so a line may span a chunk
// boundary. A single frame carrying the whole document (N=1) behaves
// exactly as v0.1.x.
message LogLinesInput {
  // A CHUNK of the text's raw bytes, UTF-8. Successive frames' text is
  // CONCATENATED byte-for-byte to reconstruct the full document — chunk
  // boundaries need not fall on line boundaries, and a multi-byte UTF-8
  // rune may be split across two frames; do NOT decode/validate a single
  // frame's text in isolation. Lines may be separated by "\n" or "\r\n"; a
  // leading UTF-8 BOM (checked only on the very first frame) is tolerated.
  // There is no concept of a malformed line — every line, including an
  // empty one, produces a frame.
  string text = 1;
}

// One line of the input text, in document order, with its line terminator
// stripped.
message LogLineFrame {
  // 0-based position of this line among all lines in the document.
  int32 index = 1;
  // 1-based line number, matching how line numbers are conventionally
  // reported by editors and log viewers.
  int32 line_number = 2;
  // The line's text with its trailing "\n"/"\r\n" removed. May be empty
  // (a blank line is still a line and still produces a frame).
  string text = 3;
  // True on the last frame emitted for this input document. Empty input
  // text emits exactly one frame with is_final=true, line_number=1, and
  // text="" (an empty document is treated as one empty line, matching how
  // splitting "" on newlines yields a single empty segment).
  bool is_final = 4;
}

// ---------------------------------------------------------------------------
// StreamSseEvents
// ---------------------------------------------------------------------------

// A raw text/event-stream transcript (Server-Sent Events wire format) to
// parse into individual events per the WHATWG SSE specification.
// StreamSseEvents consumes a STREAM of these as one continuous transcript
// (v0.2.0): the pending id/event/data/retry field buffers carry across
// every frame received in one node invocation, so an event's fields may
// span a chunk boundary — including "\r\n" split as a bare "\r" at the end
// of one frame and "\n" at the start of the next. A single frame carrying
// the whole transcript (N=1) behaves exactly as v0.1.x.
message SseInput {
  // A CHUNK of the transcript's raw bytes, UTF-8. Successive frames' text
  // is CONCATENATED byte-for-byte to reconstruct the full transcript —
  // chunk boundaries need not fall on line boundaries, and a multi-byte
  // UTF-8 rune may be split across two frames; do NOT decode/validate a
  // single frame's text in isolation.
  string text = 1;
}

// One dispatched SSE event. Parsing follows the WHATWG spec's event-stream
// parsing algorithm: fields are accumulated line-by-line until a blank line
// dispatches the pending event; unrecognized field names and comment lines
// (starting with ":") are silently ignored, exactly as the spec requires —
// so, unlike the other nodes in this package, there is no error frame for
// this node; the format is total by design. One deliberate deviation from a
// live EventSource connection: if the transcript does not end with a
// trailing blank line, any pending event with a non-empty data buffer is
// still flushed as a final frame (a live connection would instead discard
// it as an incomplete trailing event) — this makes hand-written or
// truncated transcripts still yield their last event.
message SseEventFrame {
  // 0-based position of this event among events actually dispatched.
  int32 index = 1;
  // The event's id field: the last non-null "id:" value seen at or before
  // this event's dispatch (per spec, the id buffer persists across events
  // until overwritten). Empty if no id has been set yet.
  string id = 2;
  // The event's type: the value of its "event:" field, or "message" if none
  // was set (per spec default).
  string event = 3;
  // The event's data, i.e. every "data:" line's value for this event joined
  // with "\n", with the single trailing newline the spec adds removed.
  string data = 4;
  // The reconnection time in milliseconds from a "retry:" field seen at or
  // before this event, if any (per spec the retry buffer persists like id).
  // Meaningful only when retry_set is true.
  int32 retry = 5;
  // True when a "retry:" field with a valid non-negative integer value has
  // been seen at or before this event; distinguishes an explicit retry:0
  // from no retry field having been set at all.
  bool retry_set = 6;
  // True on the last frame emitted for this input document.
  bool is_final = 7;
}

// ---------------------------------------------------------------------------
// ParseCsvRecords (bounded, unary sibling of StreamCsvRecords)
// ---------------------------------------------------------------------------

// A whole (bounded, in-memory) CSV document to parse into a JSON array of
// records in ONE call -- for composing with a JSON-records-based tool (e.g.
// reconcile-tools/Reconcile) inside a UNARY flow, where StreamCsvRecords'
// per-row pipeline frames cannot be accumulated into one downstream message
// (a pipeline node's frames are not joinable/composable into a single
// message for a unary consumer in the same flow). For a large file where
// buffering the whole document in memory is undesirable, use
// StreamCsvRecords (or a client-streamed direct invoke) instead -- this node
// is for bounded, in-flow statements/exports, not arbitrarily large files.
message CsvParseInput {
  // The full CSV document text, UTF-8. Unlike CsvInput, this is the WHOLE
  // document in one field -- there is no chunk/frame concept here.
  string text = 1;
  // Field delimiter as a single character. Empty means the default ",".
  string delimiter = 2;
  // When true, the first physical row is consumed as a header row and its
  // own values become `headers` on the output -- unless explicit_headers is
  // also set, in which case the row is still consumed/discarded but
  // explicit_headers' values are used instead of its content.
  bool has_header = 3;
  // When true, leading whitespace in each field is trimmed (encoding/csv's
  // TrimLeadingSpace option). Defaults to false (whitespace preserved).
  bool trim_leading_space = 4;
  // Optional caller-supplied column names, used as every record's JSON keys
  // instead of reading them from the document. Set this when the document
  // has no header row at all (leave has_header false) or when it has one you
  // want to skip past without using its literal values (set has_header true
  // AND this). When empty and has_header is also false, column names are
  // synthesized as "col_0", "col_1", ... from the first data row's own
  // column count.
  repeated string explicit_headers = 5;
}

// One row that could not be included in records_json.
message CsvSkippedRow {
  // 1-based data row number (the header row, if consumed, is not counted).
  int32 row_number = 1;
  // Human-readable reason: either a genuine CSV syntax error surfaced by the
  // underlying parser, or a column-count mismatch against the established
  // header width (see CsvParseResult.headers). A ragged row (different
  // column count than the header) is deliberately treated as a SKIP here,
  // not a silently-shifted or padded field mapping -- unlike
  // StreamCsvRecords' `values`, this node only ever emits records keyed BY
  // NAME, and a caller reconciling financial data must never have a value
  // silently assigned to the wrong column name.
  string reason = 2;
}

// A whole-document failure -- set only when NO rows could be attempted at
// all: a bad delimiter argument, a syntax error in the header row itself
// (which makes column names impossible to establish, and -- like any
// unterminated quote -- may have consumed the rest of the document trying to
// find a closing quote), or a duplicate column name in the established
// headers (a duplicate would silently overwrite an earlier value when
// records are keyed by name, so it is rejected outright rather than risking
// silent data loss). Individual bad DATA rows do not set this; they appear
// in skipped_rows instead.
message CsvParseError {
  // Stable machine-readable code: "INVALID_ARGUMENT" (bad delimiter, or a
  // duplicate column name in headers) or "PARSE_ERROR" (the header row
  // itself failed to parse). Empty means no whole-document error occurred.
  string code = 1;
  // Human-readable detail.
  string message = 2;
}

// The result of a bounded, whole-document CSV parse.
message CsvParseResult {
  // Every successfully parsed data row, as one JSON array of objects keyed
  // by `headers` (column name -> value). Every value is always a JSON
  // STRING -- no numeric/boolean/null inference is EVER performed on a cell
  // (unlike e.g. a columnar-format converter that auto-types by column);
  // typing a value is entirely the caller's decision downstream (a decimal
  // amount string is never silently routed through a float type here). "[]"
  // if error is set or there were zero parseable data rows.
  string records_json = 1;
  // Column names actually used as each record's JSON keys, in column order
  // -- either the consumed header row, explicit_headers, or synthesized
  // "col_0".."col_{N-1}" from the first data row's own width.
  repeated string headers = 2;
  // Count of rows successfully parsed and included in records_json.
  int32 rows_parsed = 3;
  // Rows excluded from records_json, in row order, with why -- so a caller
  // can detect a half-parsed document (rows_parsed alone can't distinguish
  // "clean 40-row file" from "40 rows attempted, 12 silently dropped").
  // CAVEAT: a genuine unterminated-quote syntax error can make the
  // underlying parser lose its position for the remainder of the document,
  // silently consuming one or more subsequent rows before reaching EOF -- in
  // that case only ONE skipped_rows entry appears even though more than one
  // row's data was lost. This mirrors StreamCsvRecords' identical inherent
  // limitation (documented there as "unrecoverable mid-document").
  repeated CsvSkippedRow skipped_rows = 4;
  // Set only on a whole-document failure; see CsvParseError. When set,
  // records_json is "[]" and rows_parsed/skipped_rows are both empty --
  // nothing was attempted.
  CsvParseError error = 5;
}

// ---------------------------------------------------------------------------
// ParseNdjsonRecords (bounded, unary sibling of StreamNdjsonRecords)
// ---------------------------------------------------------------------------

// A whole (bounded, in-memory) NDJSON/JSONL document to parse in ONE call.
// See CsvParseInput's doc for why a bounded unary sibling exists alongside
// the Stream* pipeline node.
message NdjsonParseInput {
  // The full NDJSON document text, UTF-8. One JSON value per non-blank
  // line; blank lines are skipped.
  string text = 1;
}

// One line that could not be included in records_json.
message NdjsonSkippedLine {
  // 1-based source line number.
  int32 line_number = 1;
  // Human-readable JSON parse error for this line.
  string reason = 2;
}

// The result of a bounded, whole-document NDJSON parse. Lines are
// independent of one another (unlike a CSV row, one malformed line can never
// desynchronize the rest of the document), so every malformed line is
// individually skipped and parsing always continues to the end -- there is
// no whole-document error concept for this node.
message NdjsonParseResult {
  // Every successfully parsed line's JSON value, collected into one JSON
  // array, in document order. Each element is exactly that line's own JSON
  // text (object, array, string, number, bool, or null -- whatever it was)
  // -- never re-typed or reshaped.
  string records_json = 1;
  // Count of non-blank lines successfully parsed and included in
  // records_json.
  int32 rows_parsed = 2;
  // Non-blank lines that failed to parse as JSON, in line order.
  repeated NdjsonSkippedLine skipped_rows = 3;
}

// ---------------------------------------------------------------------------
// ParseJsonArrayItems (bounded, unary sibling of StreamJsonArrayItems)
// ---------------------------------------------------------------------------

// A whole (bounded, in-memory) JSON document, whose top-level value must be
// an array, to parse in ONE call. See CsvParseInput's doc for why a bounded
// unary sibling exists alongside the Stream* pipeline node.
message JsonArrayParseInput {
  // The full JSON document text, UTF-8. Empty or whitespace-only text is
  // treated as "nothing to report" (items_parsed=0, no error), matching
  // StreamJsonArrayItems' identical treatment of a frameless/blank input --
  // not a structural problem, since there is no non-whitespace content to
  // judge as array-shaped or not.
  string text = 1;
}

// A whole-document failure. Unlike a CSV row, a JSON array element has no
// cheap resync boundary once the decoder's position is untrustworthy past a
// malformed token, so any structural problem here is fatal to the whole
// parse -- matching StreamJsonArrayItems' identical "unrecoverable
// mid-document" behavior, not CSV's per-row skip.
message JsonArrayParseError {
  // "INVALID_ARGUMENT" if the (non-blank) top-level value is not a JSON
  // array, "PARSE_ERROR" if the document (or one of its elements) fails to
  // decode. Empty means no error occurred.
  string code = 1;
  // Human-readable detail.
  string message = 2;
}

// The result of a bounded, whole-document JSON-array parse.
message JsonArrayParseResult {
  // The array's elements, re-assembled as one JSON array (== the original
  // top-level array, re-serialized). "[]" if error is set or the array was
  // empty.
  string items_json = 1;
  // Count of elements successfully parsed. Zero and error unset means
  // either a valid empty array ("[]") or blank input was the whole
  // document.
  int32 items_parsed = 2;
  // Set on any structural problem; see JsonArrayParseError. When set,
  // items_json is "[]" and items_parsed is 0 -- nothing is partially
  // returned.
  JsonArrayParseError error = 3;
}

// ---------------------------------------------------------------------------
// SniffFormat (unary companion)
// ---------------------------------------------------------------------------

// Arbitrary text whose likely wire format should be guessed, to route it to
// the right Stream* node.
message SniffFormatInput {
  // The text to inspect. Only a prefix is actually needed for a confident
  // guess, but the full text may be passed.
  string text = 1;
}

// A best-effort format guess. This is advisory only — always driven by a
// handful of cheap structural checks (never a full parse of the whole
// document), so treat it as a routing hint, not a validation result.
message SniffFormatResult {
  // One of "ndjson", "csv", "json_array", "sse", "log_lines", or "unknown".
  string format = 1;
  // A rough confidence score in [0.0, 1.0]; higher means the structural
  // signals were more unambiguous. Not a statistical probability.
  double confidence = 2;
  // A short human-readable explanation of which signal(s) drove the guess,
  // e.g. "first 5 non-blank lines each parsed as standalone JSON values".
  string reason = 3;
}
